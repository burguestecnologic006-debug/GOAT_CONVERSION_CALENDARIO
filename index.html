<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --surface-2: #F1EFEA;
  --border: #E7E4DC;
  --text: #201F1C;
  --text-dim: #7A776E;
  --accent: #2A282E;
  --accent-tint: #F1EFED;
  --accent-dark: #141317;
  --on-accent: #FFFFFF;
  --red: #DC2626;
  --red-tint: #FCE8E6;
  --amber: #F5A623;
  --emerald: #10B981;
  --pink: #EC4899;
  --danger: #E5484D;
  --danger-tint: #FDEBEC;
  --font-display: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
  --radius: 16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
}
#root{max-width: 980px; margin: 0 auto; padding: 28px 20px 80px;}

/* ---------- header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; margin-bottom: 24px; flex-wrap: wrap;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{
  width:44px; height:44px; border-radius: 12px;
  background: #0A0A0A;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; overflow:hidden;
  box-shadow: 0 2px 6px rgba(20,18,10,.18);
}
.brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
.brand-mark svg{width:20px; height:20px;}
.brand-name{
  font-family: var(--font-display); font-weight:800; font-size: 19px;
  letter-spacing: -0.01em;
}
.brand-sub{
  font-family: var(--font-body); font-size: 11.5px; color: var(--text-dim);
  letter-spacing: 0.03em; margin-top:1px; font-weight:600; text-transform:uppercase;
}
.mode-toggle{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.pill-btn{
  font-family: var(--font-body); font-weight:600; font-size: 12.5px; letter-spacing:0.01em;
  padding: 9px 15px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-dim); cursor:pointer;
  display:flex; align-items:center; gap:7px; transition: all .15s ease;
  box-shadow: 0 1px 2px rgba(20,18,10,.04);
}
.pill-btn:hover{border-color: var(--accent); color: var(--text); transform: translateY(-1px);}
.pill-btn.active{background: var(--accent); color: var(--on-accent); border-color:var(--accent); font-weight:700;}
.rec-dot{width:7px;height:7px;border-radius:50%;background:var(--danger); flex-shrink:0;}
.rec-dot.on{background: var(--emerald); box-shadow: 0 0 0 3px rgba(16,185,129,.18);}

/* ---------- layout ---------- */
.panel{
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px;
  box-shadow: 0 1px 3px rgba(20,18,10,.04);
}
.grid-2{display:grid; grid-template-columns: 1.3fr 1fr; gap: 18px;}
@media (max-width: 760px){ .grid-2{grid-template-columns: 1fr;} }

/* ---------- calendar ---------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.cal-month{font-family: var(--font-display); font-weight:800; font-size:19px; text-transform:capitalize;}
.cal-nav{display:flex; gap:6px;}
.nav-btn{
  width:32px; height:32px; border-radius:10px; border:1px solid var(--border);
  background: var(--surface-2); color: var(--text); cursor:pointer; font-size:15px;
  display:flex; align-items:center; justify-content:center;
}
.nav-btn:hover{border-color:var(--accent); color:var(--accent);}
.weekdays{display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:8px;}
.weekdays span{
  font-family: var(--font-body); font-size:11px; color: var(--text-dim); font-weight:700;
  text-align:center; letter-spacing:0.04em; text-transform:uppercase;
}
.days{display:grid; grid-template-columns: repeat(7,1fr); gap:6px;}
.day-cell{
  aspect-ratio: 1; border-radius: 12px; border:1.5px solid transparent;
  background: var(--surface-2); cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; transition: all .12s ease;
}
.day-cell:hover{border-color: var(--accent); background: var(--accent-tint);}
.day-cell.empty{background:transparent; cursor:default;}
.day-cell.empty:hover{border-color:transparent; background:transparent;}
.day-cell.past{opacity:.35; cursor:not-allowed;}
.day-cell.past:hover{border-color:transparent; background:var(--surface-2);}
.day-cell.closed{opacity:.4;}
.day-cell.selected{border-color: var(--accent); background: var(--accent-tint);}
.day-num{font-family: var(--font-body); font-size:13.5px; font-weight:600;}
.day-bars{display:flex; gap:3px; align-items:center; height:6px;}
.day-bar{width:5px; height:5px; border-radius:50%; background: var(--text-dim);}
.day-today{background: var(--accent-tint);}
.day-today .day-num{color: var(--accent-dark); font-weight:800;}
.day-full .day-num{color: var(--text-dim);}

.legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border);}
.legend-item{
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text);
  padding: 5px 10px 5px 8px; border-radius:999px; background: var(--surface-2);
}
.legend-dot{width:8px;height:8px;border-radius:50%;}

/* ---------- day panel ---------- */
.day-panel-title{font-family: var(--font-display); font-weight:800; font-size:17px; margin-bottom:3px; text-transform:capitalize;}
.day-panel-sub{font-family: var(--font-body); font-size:12.5px; color:var(--text-dim); margin-bottom:18px;}
.type-select{display:flex; flex-direction:column; gap:8px; margin-bottom:20px;}
.type-opt{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; border-radius:12px; border:1.5px solid transparent;
  background: var(--surface-2); cursor:pointer; transition: all .12s ease;
}
.type-opt:hover{transform: translateY(-1px);}
.type-opt.selected{border-color: var(--accent); background: var(--accent-tint);}
.type-opt-left{display:flex; align-items:center; gap:10px;}
.type-swatch{width:11px; height:11px; border-radius:4px; flex-shrink:0;}
.type-name{font-size:13.5px; font-weight:700;}
.type-dur{font-family: var(--font-body); font-size:11.5px; color:var(--text-dim); font-weight:600; background:var(--surface); padding:3px 9px; border-radius:999px;}

.slots-title{font-family: var(--font-body); font-size:11.5px; color:var(--text-dim); letter-spacing:0.04em; text-transform:uppercase; font-weight:700; margin: 4px 0 10px;}
.slots-grid{display:grid; grid-template-columns: repeat(3,1fr); gap:8px; max-height:280px; overflow-y:auto; padding-right:2px;}
.slot-btn{
  font-family: var(--font-body); font-weight:600; font-size:13px; padding:10px 4px; border-radius:10px;
  border:1.5px solid var(--border); background: var(--surface); color: var(--text); cursor:pointer;
  text-align:center; transition: all .12s ease;
}
.slot-btn:hover{border-color: var(--accent); color: var(--accent-dark); background: var(--accent-tint);}
.slot-btn.selected{background: var(--accent); color: var(--on-accent); border-color:var(--accent); font-weight:700;}
.empty-note{font-size:13px; color: var(--text-dim); padding: 18px 0; text-align:center;}

/* ---------- form ---------- */
.field{margin-bottom:12px;}
.field label{font-size:12px; font-weight:600; color: var(--text-dim); display:block; margin-bottom:5px;}
.field input, .field textarea, .field select{
  width:100%; background: var(--surface-2); border:1.5px solid var(--border); border-radius:10px;
  color: var(--text); padding: 10px 12px; font-family: var(--font-body); font-size:13.5px;
}
.field textarea{resize:vertical; min-height:56px;}
.field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.btn{
  font-family: var(--font-body); font-weight:700; font-size:13.5px; padding:11px 16px;
  border-radius:10px; border:none; cursor:pointer; transition: all .12s ease;
}
.btn-primary{background: linear-gradient(135deg, var(--accent), #4A1D1D); color: var(--on-accent);}
.btn-primary:hover{background: linear-gradient(135deg, var(--accent-dark), var(--red)); transform: translateY(-1px);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background: var(--surface-2); color: var(--text); border:1.5px solid var(--border);}
.btn-ghost:hover{border-color: var(--accent); color:var(--accent-dark);}
.btn-danger{background: var(--danger-tint); color: var(--danger); border:1.5px solid transparent;}
.btn-danger:hover{border-color: var(--danger);}
.btn-block{width:100%;}
.btn-row{display:flex; gap:8px; margin-top:14px;}

/* ---------- modal ---------- */
.overlay{
  position:fixed; inset:0; background: rgba(32,31,28,.45); backdrop-filter: blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
}
.modal{
  background: var(--surface); border:1px solid var(--border); border-radius: 20px;
  padding:26px; max-width:440px; width:100%; max-height:86vh; overflow-y:auto;
  box-shadow: 0 20px 50px rgba(20,18,10,.18);
}
.modal-title{font-family: var(--font-display); font-weight:800; font-size:18px; margin-bottom:16px;}
.close-x{position:absolute; top:18px; right:18px; background: var(--surface-2); border:none; color:var(--text-dim); cursor:pointer; font-size:16px; width:28px; height:28px; border-radius:50%;}
.close-x:hover{color:var(--text); background:var(--border);}

/* ---------- admin ---------- */
.admin-section{margin-bottom:22px;}
.admin-section-title{
  font-family: var(--font-body); font-size:11.5px; letter-spacing:0.04em; text-transform:uppercase; font-weight:700;
  color: var(--text-dim); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;
}
.hours-row{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
.hours-day{width:38px; font-family: var(--font-body); font-size:12.5px; font-weight:700; color: var(--text); flex-shrink:0; text-transform:capitalize;}
.hours-row input[type=time]{
  background: var(--surface-2); border:1.5px solid var(--border); border-radius:8px; color:var(--text);
  padding:6px 8px; font-family: var(--font-body); font-size:12px; width: 92px;
}
.hours-toggle{
  width:36px; height:20px; border-radius:999px; background: var(--border); position:relative;
  cursor:pointer; flex-shrink:0; border:none; margin-left:auto;
}
.hours-toggle.on{background: var(--emerald);}
.hours-toggle::after{
  content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background: #FFFFFF; transition: transform .15s ease; box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.hours-toggle.on::after{transform: translateX(16px);}
.type-row{
  display:flex; align-items:center; gap:8px; margin-bottom:8px; padding:10px 11px;
  background: var(--surface-2); border-radius:12px; border:1px solid var(--border);
}
.type-row input[type=text]{width:auto; flex:1; padding:7px 9px; font-size:12.5px; border-radius:8px;}
.type-row input[type=number]{width:58px; padding:7px 6px; font-family:var(--font-body); font-size:12px; border-radius:8px;}
.color-dot-btn{width:20px; height:20px; border-radius:7px; border:2px solid transparent; cursor:pointer; flex-shrink:0;}
.color-dot-btn.picked{border-color: var(--text);}
.remove-x{background:none; border:none; color: var(--text-dim); cursor:pointer; font-size:15px; flex-shrink:0;}
.remove-x:hover{color: var(--danger);}
.add-link{
  font-family: var(--font-body); font-size:12px; font-weight:700; color: var(--accent-dark); background:none; border:none;
  cursor:pointer; padding:4px 0; display:flex; align-items:center; gap:5px;
}

.booking-list{display:flex; flex-direction:column; gap:8px; max-height: 340px; overflow-y:auto;}
.booking-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; background: var(--surface-2);
  border-radius:12px; border:1px solid var(--border); border-left:4px solid var(--accent);
}
.booking-item.is-blocked{border-left-color: var(--text-dim);}
.booking-main{flex:1; min-width:0;}
.booking-date{font-family: var(--font-body); font-size:11.5px; color: var(--text-dim); font-weight:600;}
.booking-who{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.booking-type-tag{font-size:11.5px; color: var(--text-dim);}

.toast{
  position:fixed; bottom:22px; left:50%; transform: translateX(-50%);
  background: var(--text); color:#FFFFFF; padding:12px 20px; border-radius:999px;
  font-size:13px; font-weight:700; z-index:100; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  display:flex; align-items:center; gap:8px;
}
.confirm-check{
  width:56px; height:56px; border-radius:50%; background: var(--red-tint);
  display:flex; align-items:center; justify-content:center; margin: 4px auto 16px;
}
.share-box{
  display:flex; align-items:center; gap:8px; background: var(--surface-2); border:1.5px solid var(--border);
  border-radius:10px; padding:9px 11px; margin-top: 10px;
}
.share-box input{flex:1; background:none; border:none; color: var(--text-dim); font-family: var(--font-body); font-size:11.5px;}
.share-box input:focus{outline:none;}
.helper-text{font-size:12.5px; color: var(--text-dim); line-height:1.55;}
.loading-note{text-align:center; padding: 60px 0; color: var(--text-dim); font-family: var(--font-body); font-size:13px; font-weight:600;}

</style>
</head>

<script>
  // Adaptador: implementa la misma interfaz get/set/delete/list que usa
  // el resto de la app, pero guardando los datos en Firestore en vez de
  // en el almacenamiento propio de Claude. Así el resto del código no
  // necesita cambiar.
  let firebaseReady = false;
  let db = null;
  try{
    if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'TU_API_KEY'){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      firebaseReady = true;
    }
  }catch(e){ console.error('Error iniciando Firebase', e); }

  window.storage = {
    async get(key, shared){
      if(!firebaseReady) throw new Error('Firebase no configurado');
      const snap = await db.collection('agenda_data').doc(key).get();
      if(!snap.exists) throw new Error('not-found');
      return { key, value: snap.data().value, shared: !!shared };
    },
    async set(key, value, shared){
      if(!firebaseReady) throw new Error('Firebase no configurado');
      await db.collection('agenda_data').doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      if(!firebaseReady) throw new Error('Firebase no configurado');
      await db.collection('agenda_data').doc(key).delete();
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      if(!firebaseReady) throw new Error('Firebase no configurado');
      const snap = await db.collection('agenda_data').get();
      const keys = [];
      snap.forEach(d=>{ if(!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return { keys, prefix, shared: !!shared };
    }
  };
</script>

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
function todayKey(){ return dateKey(new Date()); }

/* ---------------- calendar export helpers ---------------- */
function toUtcStamp(dateStr, timeStr){
  const d = new Date(dateStr+'T'+timeStr+':00');
  return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
}
function bookingRangeUtc(booking){
  const start = toUtcStamp(booking.date, booking.time);
  const endDate = new Date(booking.date+'T'+booking.time+':00');
  endDate.setMinutes(endDate.getMinutes() + booking.duration);
  const end = endDate.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  return { start, end };
}
function gcalLink(booking){
  const type = booking.status === 'blocked' ? null : typeById(booking.typeId);
  const title = encodeURIComponent((type ? type.name : 'Bloqueado') + (booking.clientName && booking.clientName !== 'Bloqueado' ? ' — ' + booking.clientName : ''));
  const { start, end } = bookingRangeUtc(booking);
  const detailsParts = [];
  if(booking.clientContact) detailsParts.push('Contacto: ' + booking.clientContact);
  if(booking.notes) detailsParts.push('Notas: ' + booking.notes);
  const details = encodeURIComponent(detailsParts.join(' · ') || (state.config.businessName + ' — reserva agendada'));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}`;
}
function icsEscape(s){ return (s||'').replace(/[\n,;]/g, ' '); }

/* ---------------- webhook notification (Make.com) ---------------- */
async function notifyNewBooking(booking){
  const url = (state.config.notifyWebhookUrl || '').trim();
  if(!url) return;
  const type = typeById(booking.typeId);
  const dObj = new Date(booking.date+'T00:00:00');
  const payload = {
    negocio: state.config.businessName,
    tipo: type ? type.name : 'Bloqueado',
    fecha: booking.date,
    fecha_legible: `${DAY_LABELS_FULL[dObj.getDay()]}, ${dObj.getDate()} de ${MONTH_NAMES[dObj.getMonth()]}`,
    hora: booking.time,
    duracion_min: booking.duration,
    cliente: booking.clientName,
    contacto: booking.clientContact,
    notas: booking.notes || ''
  };
  try{
    await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
  }catch(e){ /* aviso best-effort: si falla, no interrumpe la reserva */ }
}
function downloadIcs(booking){
  const type = booking.status === 'blocked' ? null : typeById(booking.typeId);
  const { start, end } = bookingRangeUtc(booking);
  const nowStamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const summary = icsEscape((type ? type.name : 'Bloqueado') + (booking.clientName && booking.clientName !== 'Bloqueado' ? ' - ' + booking.clientName : ''));
  const descParts = [];
  if(booking.clientContact) descParts.push('Contacto: ' + booking.clientContact);
  if(booking.notes) descParts.push('Notas: ' + booking.notes);
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//' + (state.config.businessName||'Agenda') + '//ES',
    'BEGIN:VEVENT',
    'UID:' + booking.id + '@agenda',
    'DTSTAMP:' + nowStamp,
    'DTSTART:' + start,
    'DTEND:' + end,
    'SUMMARY:' + summary,
    'DESCRIPTION:' + icsEscape(descParts.join(' · ')),
    'END:VEVENT','END:VCALENDAR'
  ];
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'reserva-' + booking.date + '-' + booking.time.replace(':','') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- availability logic ---------------- */
function getBookingsForDate(dkey){
  return state.bookings.filter(b => b.date === dkey);
}
function typeById(id){ return state.config.types.find(t=>t.id===id); }

function computeSlots(dkey, typeId, durationOverride){
  const type = typeById(typeId);
  if(!type) return [];
  const duration = durationOverride || type.duration;
  const dow = new Date(dkey+'T00:00:00').getDay();
  const hours = state.config.workingHours[dow];
  if(!hours || !hours.open) return [];
  const dayBookings = getBookingsForDate(dkey);
  const step = state.config.slotStep || 30;
  const openMin = timeToMin(hours.start);
  const closeMin = timeToMin(hours.end);
  const slots = [];
  const isToday = dkey === todayKey();
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  for(let start = openMin; start + duration <= closeMin; start += step){
    if(isToday && start <= nowMin) continue;
    const end = start + duration;
    const overlaps = dayBookings.some(b=>{
      const bStart = timeToMin(b.time);
      const bEnd = bStart + b.duration;
      return start < bEnd && end > bStart;
    });
    if(!overlaps) slots.push(minToTime(start));
  }
  return slots;
}
function formatDuration(mins){
  if(mins % 60 === 0) return (mins/60) + ' h';
  if(mins < 60) return mins + ' min';
  return Math.floor(mins/60) + ' h ' + (mins%60) + ' min';
}
function durationOptionsFor(type){
  const opts = [];
  const step = type.durationStep || 30;
  for(let m = type.minDuration || step; m <= (type.maxDuration || m); m += step) opts.push(m);
  return opts;
}

function dayStatus(dkey){
  const dow = new Date(dkey+'T00:00:00').getDay();
  const hours = state.config.workingHours[dow];
  if(!hours || !hours.open) return 'closed';
  const dayBookings = getBookingsForDate(dkey);
  const anyTypeHasSlot = state.config.types.some(t => computeSlots(dkey, t.id).length > 0);
  if(!anyTypeHasSlot) return dayBookings.length ? 'full' : 'closed';
  return dayBookings.length ? 'partial' : 'open';
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  const root = document.getElementById('root');

function renderCalendarPanel(){
  const panel = el(`<div class="panel"></div>`);
  const y = state.view.getFullYear(), m = state.view.getMonth();
  const head = el(`
    <div class="cal-head">
      <div class="cal-month">${MONTH_NAMES[m]} ${y}</div>
      <div class="cal-nav">
        <button class="nav-btn" id="prevM">‹</button>
        <button class="nav-btn" id="nextM">›</button>
      </div>
    </div>
  `);
  head.querySelector('#prevM').onclick = ()=>{ state.view = new Date(y, m-1, 1); render(); };
  head.querySelector('#nextM').onclick = ()=>{ state.view = new Date(y, m+1, 1); render(); };
  panel.appendChild(head);

  const wdRow = el(`<div class="weekdays"></div>`);
  DAY_NAMES.forEach(d=> wdRow.appendChild(el(`<span>${d}</span>`)));
  panel.appendChild(wdRow);

  const daysGrid = el(`<div class="days"></div>`);
  const firstDow = new Date(y, m, 1).getDay();
  const numDays = new Date(y, m+1, 0).getDate();
  const tKey = todayKey();

  for(let i=0;i<firstDow;i++) daysGrid.appendChild(el(`<div class="day-cell empty"></div>`));

  for(let d=1; d<=numDays; d++){
    const dateObj = new Date(y, m, d);
    const dkey = dateKey(dateObj);
    const isPast = dkey < tKey;
    const status = dayStatus(dkey);
    const dayBookings = getBookingsForDate(dkey);

    let cls = 'day-cell';
    if(isPast) cls += ' past';
    if(status === 'closed') cls += ' closed';
    if(status === 'full') cls += ' day-full';
    if(dkey === tKey) cls += ' day-today';
    if(state.selectedDate === dkey) cls += ' selected';

    const cell = el(`<div class="${cls}"><span class="day-num">${d}</span><div class="day-bars"></div></div>`);
    const barsWrap = cell.querySelector('.day-bars');
    const uniqueTypesBooked = [...new Set(dayBookings.map(b=>b.typeId))];
    uniqueTypesBooked.slice(0,4).forEach(tid=>{
      const t = typeById(tid);
      const color = t ? t.color : 'var(--blocked)';
      barsWrap.appendChild(el(`<span class="day-bar" style="height:${5}px;background:${color}"></span>`));
    });

    if(!isPast){
      cell.onclick = ()=>{
        state.selectedDate = dkey;
        state.selectedTypeId = state.config.types[0] ? state.config.types[0].id : null;
        state.selectedDuration = state.config.types[0] ? state.config.types[0].duration : null;
        state.selectedSlot = null;
        render();
      };
    }
    daysGrid.appendChild(cell);
  }
  panel.appendChild(daysGrid);

  const legend = el(`<div class="legend"></div>`);
  state.config.types.forEach(t=>{
    legend.appendChild(el(`<div class="legend-item"><span class="legend-dot" style="background:${t.color}"></span>${esc(t.name)}</div>`));
  });
  panel.appendChild(legend);

  return panel;
}

function renderSidePanel(){
  const panel = el(`<div class="panel"></div>`);
  if(!state.selectedDate){

  panel.appendChild(el(`<div class="day-panel-title">${label}</div>`));

  if(state.isAdmin){
    const dayBookings = getBookingsForDate(state.selectedDate).sort((a,b)=> a.time.localeCompare(b.time));
    panel.appendChild(el(`<div class="slots-title" style="margin-top:2px;">Compromisos de este día</div>`));
    if(dayBookings.length === 0){
      panel.appendChild(el(`<div class="empty-note" style="padding:10px 0 18px;">No tienes nada agendado este día.</div>`));
    } else {
      const list = el(`<div class="booking-list" style="margin-bottom:20px; max-height:220px;"></div>`);
      dayBookings.forEach(b=>{
        const isBlocked = b.status === 'blocked';
        const type = typeById(b.typeId);
        const endMin = timeToMin(b.time) + b.duration;
        const item = el(`
          <div class="booking-item ${isBlocked?'is-blocked':''}" style="${!isBlocked && type ? `border-left-color:${type.color}`:''}">
            <div class="booking-main">
              <div class="booking-date">${b.time} – ${minToTime(endMin)} · ${formatDuration(b.duration)}</div>
              <div class="booking-who">${isBlocked ? 'Bloqueado' : esc(b.clientName)}</div>
              <div class="booking-type-tag">${isBlocked ? esc(b.notes||'Horario no disponible') : (type?esc(type.name):'') + (b.clientContact? ' · '+esc(b.clientContact):'')}</div>
            </div>
          </div>
        `);
        list.appendChild(item);
      });
      panel.appendChild(list);
    }
    panel.appendChild(el(`<div class="day-panel-sub" style="margin-bottom:6px;">Agendar manualmente para este día</div>`));
  } else {
    panel.appendChild(el(`<div class="day-panel-sub">Elige el tipo de sesión y un horario disponible</div>`));
  }

  const typeWrap = el(`<div class="type-select"></div>`);
  state.config.types.forEach(t=>{
    const selected = state.selectedTypeId === t.id;
    const isFlex = t.durationMode === 'flexible';
    const opt = el(`
      <div class="type-opt ${selected?'selected':''}">
        <div class="type-opt-left">
          <span class="type-swatch" style="background:${t.color}"></span>
          <span class="type-name">${esc(t.name)}</span>
        </div>
        <span class="type-dur">${isFlex ? 'Duración libre' : formatDuration(t.duration)}</span>
      </div>
    `);
    opt.onclick = ()=>{
      state.selectedTypeId = t.id;
      state.selectedDuration = isFlex ? t.duration : t.duration;
      state.selectedSlot = null;
      render();
    };
    typeWrap.appendChild(opt);
  });
  panel.appendChild(typeWrap);

  const currentType = state.selectedTypeId ? typeById(state.selectedTypeId) : null;

  if(currentType && currentType.durationMode === 'flexible'){
    panel.appendChild(el(`<div class="slots-title">Duración de la sesión</div>`));
    const durWrap = el(`<div class="slots-grid" style="margin-bottom:18px;"></div>`);
    durationOptionsFor(currentType).forEach(m=>{
      const btn = el(`<button class="slot-btn ${state.selectedDuration===m?'selected':''}">${formatDuration(m)}</button>`);
      btn.onclick = ()=>{ state.selectedDuration = m; state.selectedSlot = null; render(); };
      durWrap.appendChild(btn);
    });
    panel.appendChild(durWrap);
  }

  panel.appendChild(el(`<div class="slots-title">Horarios disponibles</div>`));
  const slots = currentType ? computeSlots(state.selectedDate, currentType.id, state.selectedDuration) : [];
  if(slots.length === 0){
    panel.appendChild(el(`<div class="empty-note">No hay horarios disponibles este día para esta duración.</div>`));
  } else {
    const slotsGrid = el(`<div class="slots-grid"></div>`);
    slots.forEach(s=>{
      const btn = el(`<button class="slot-btn ${state.selectedSlot===s?'selected':''}">${s}</button>`);
      btn.onclick = ()=>{ state.selectedSlot = s; render(); };
      slotsGrid.appendChild(btn);
    });
    panel.appendChild(slotsGrid);

    if(state.selectedSlot){
      panel.appendChild(renderBookingForm());
    }
  }
  return panel;
}

function renderBookingForm(){
  const wrap = el(`
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <div class="field"><label>Nombre completo</label><input type="text" id="bkName" placeholder="Tu nombre" /></div>
      <div class="field"><label>WhatsApp o correo</label><input type="text" id="bkContact" placeholder="Para confirmarte la cita" /></div>
      <div class="field"><label>Notas (opcional)</label><textarea id="bkNotes" placeholder="Detalles del proyecto…"></textarea></div>
      <button class="btn btn-primary btn-block" id="bkSubmit">Confirmar reserva</button>
    </div>
  `);
  wrap.querySelector('#bkSubmit').onclick = async ()=>{
    const name = wrap.querySelector('#bkName').value.trim();
    const contact = wrap.querySelector('#bkContact').value.trim();
    const notes = wrap.querySelector('#bkNotes').value.trim();
    if(!name || !contact){ showToast('Completa nombre y contacto'); return; }

    await refreshBookings();
    const type = typeById(state.selectedTypeId);
    const duration = state.selectedDuration || type.duration;
    const conflict = getBookingsForDate(state.selectedDate).some(b=>{
      const bStart = timeToMin(b.time), bEnd = bStart+b.duration;
      const nStart = timeToMin(state.selectedSlot), nEnd = nStart+duration;
      return nStart < bEnd && nEnd > bStart;
    });
    if(conflict){ showToast('Ese horario ya fue tomado, elige otro'); state.selectedSlot=null; render(); return; }

    const booking = {
      id: uid(), date: state.selectedDate, time: state.selectedSlot, duration: duration,
      typeId: type.id, clientName: name, clientContact: contact, notes,
      status: 'confirmed', createdAt: Date.now()
    };
    state.bookings.push(booking);
    await saveBookings();
    notifyNewBooking(booking);
    state.selectedSlot = null;
    render();
    showConfirmModal(booking);
  };
  return wrap;
}

            <input type="number" value="${t.maxDuration||240}" min="15" step="15" data-idx="${idx}" data-field="maxDuration" style="width:52px;" title="Máximo (min)" />
          ` : `
            <input type="number" value="${t.duration}" min="5" step="5" data-idx="${idx}" data-field="duration" style="width:56px;" title="Duración (min)" />
          `}
          <button class="remove-x" data-idx="${idx}">✕</button>
        </div>
      `);
      row.querySelector('input[data-field=name]').oninput = (e)=>{ state.config.types[idx].name = e.target.value; };
      const durInput = row.querySelector('input[data-field=duration]');
      if(durInput) durInput.oninput = (e)=>{ state.config.types[idx].duration = parseInt(e.target.value)||30; };
      const minInput = row.querySelector('input[data-field=minDuration]');
      if(minInput) minInput.oninput = (e)=>{ state.config.types[idx].minDuration = parseInt(e.target.value)||30; };
      const maxInput = row.querySelector('input[data-field=maxDuration]');
      if(maxInput) maxInput.oninput = (e)=>{ state.config.types[idx].maxDuration = parseInt(e.target.value)||60; };
      row.querySelector('.mode-pill').onclick = ()=>{
        const nowFlex = state.config.types[idx].durationMode === 'flexible';
        state.config.types[idx].durationMode = nowFlex ? 'fixed' : 'flexible';
        if(!nowFlex){
          if(!state.config.types[idx].minDuration) state.config.types[idx].minDuration = 30;
          if(!state.config.types[idx].maxDuration) state.config.types[idx].maxDuration = 240;
          if(!state.config.types[idx].durationStep) state.config.types[idx].durationStep = 30;
          state.config.types[idx].duration = state.config.types[idx].duration || 60;
        }
        renderTypesOnly();
      };
      row.querySelector('.remove-x').onclick = ()=>{ state.config.types.splice(idx,1); renderTypesOnly(); };
      row.querySelector('.color-dot-btn').onclick = ()=>{
        const curColorIdx = TYPE_COLORS.indexOf(t.color);
        const next = TYPE_COLORS[(curColorIdx+1) % TYPE_COLORS.length];
        state.config.types[idx].color = next;
        renderTypesOnly();
      };
      typesWrap.appendChild(row);
    });
  }
  renderTypesOnly();
  overlay.querySelector('#addType').onclick = ()=>{
    state.config.types.push({ id: uid(), name:'Nuevo tipo', duration:60, durationMode:'fixed', minDuration:30, maxDuration:240, durationStep:30, color: TYPE_COLORS[state.config.types.length % TYPE_COLORS.length] });
    renderTypesOnly();
  };

  const close = ()=>{ state.showAdminModal = false; render(); };
  overlay.querySelector('#howToLink').onclick = (e)=>{
    e.preventDefault();
    const help = el(`
      <div class="overlay" style="z-index:60;">
        <div class="modal" style="position:relative; max-width:400px;">
          <button class="close-x">×</button>
          <div class="modal-title">Cómo conseguir la URL (Make.com)</div>
          <p class="helper-text">1. Crea una cuenta gratis en <b>make.com</b>.<br/><br/>
          2. Clic en "Create a new scenario".<br/><br/>
          3. Agrega el módulo <b>Webhooks → Custom webhook</b> y crea uno nuevo. Te dará una URL — cópiala aquí.<br/><br/>
          4. Agrega un segundo módulo <b>Email → Send an email</b> (o Gmail), destinado a tu correo, usando los datos que llegan del webhook (cliente, fecha, hora, tipo, contacto).<br/><br/>
          5. Guarda y activa el escenario (el interruptor "ON" arriba a la izquierda).</p>
          <button class="btn btn-primary btn-block" style="margin-top:14px;">Entendido</button>
        </div>
      </div>
    `);
    const closeHelp = ()=> help.remove();
    help.querySelector('.close-x').onclick = closeHelp;
    help.querySelector('button.btn-primary').onclick = closeHelp;
    help.onclick = (ev)=>{ if(ev.target===help) closeHelp(); };
    document.getElementById('root').appendChild(help);
  };
  overlay.querySelector('.close-x').onclick = close;
  overlay.querySelector('#cancelCfg').onclick = async ()=>{ await loadAll(); close(); };
  overlay.querySelector('#saveCfg').onclick = async ()=>{
    state.config.businessName = overlay.querySelector('#bizName').value.trim() || 'Mi estudio';
    state.config.notifyWebhookUrl = overlay.querySelector('#webhookField').value.trim();
    const newPin = overlay.querySelector('#pinField').value.trim();
    await saveConfig();
    if(newPin.length >= 4){
      try{ await window.storage.set(STORAGE_PIN_KEY, JSON.stringify(newPin), true); showToast('Configuración y PIN guardados'); }
      catch(e){ showToast('Configuración guardada (PIN no se pudo actualizar)'); }
    } else {
      showToast('Configuración guardada');
    }
    close();
  };

  return overlay;
}

/* ---------------- Bookings management modal ---------------- */
function renderBookingsModal(){
  markSeen();
  const overlay = el(`
    <div class="overlay">
      <div class="modal" style="position:relative;">
        <button class="close-x">×</button>
        <div class="modal-title">Reservas próximas</div>
        <div class="booking-list" id="bkList"></div>
      </div>
    </div>
  `);
  const close = ()=>{ state.showBookingsModal = false; render(); };
  overlay.querySelector('.close-x').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };

  const list = overlay.querySelector('#bkList');
  const tKey = todayKey();
  const upcoming = state.bookings
    .filter(b=> b.date >= tKey)
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));

  if(upcoming.length === 0){
    list.appendChild(el(`<div class="empty-note">No hay reservas próximas.</div>`));
  }
  upcoming.forEach(b=>{
    const isBlocked = b.status === 'blocked';
    const type = typeById(b.typeId);
    const item = el(`
      <div class="booking-item ${isBlocked?'is-blocked':''}" style="${!isBlocked && type ? `border-left-color:${type.color}`:''}">
        <div class="booking-main">
          <div class="booking-date">${b.date} · ${b.time} (${b.duration} min)</div>
          <div class="booking-who">${isBlocked? 'Bloqueado' : esc(b.clientName)}</div>
          <div class="booking-type-tag">${isBlocked ? esc(b.notes||'Horario no disponible') : (type?esc(type.name):'') + (b.clientContact? ' · '+esc(b.clientContact):'')}</div>
        </div>
        <button class="nav-btn" data-cal="${b.id}" title="Agregar a Google Calendar">📅</button>
        <button class="btn btn-danger" data-id="${b.id}">Cancelar</button>
      </div>
    `);
    item.querySelector('[data-cal]').onclick = ()=> window.open(gcalLink(b), '_blank');
    item.querySelector('button.btn-danger').onclick = async ()=>{
      state.bookings = state.bookings.filter(x=>x.id!==b.id);
      await saveBookings();
      showToast('Reserva cancelada');
      close();
      render();
    };
    list.appendChild(item);
  });

  return overlay;
}

/* ---------------- Block time modal ---------------- */
function renderBlockModal(){
  const overlay = el(`
    <div class="overlay">
      <div class="modal" style="position:relative; max-width:380px;">
        <button class="close-x">×</button>
        <div class="modal-title">Bloquear horario</div>
        <p class="helper-text" style="margin-bottom:14px;">Usa esto para reservar tiempo personal, mantenimiento o cualquier hora en la que no quieras recibir clientes.</p>
        <div class="field"><label>Fecha</label><input type="date" id="blkDate" value="${state.selectedDate||todayKey()}" /></div>
        <div class="field"><label>Hora de inicio</label><input type="time" id="blkTime" value="09:00" /></div>
        <div class="field"><label>Duración (minutos)</label><input type="number" id="blkDur" value="60" min="5" step="5" /></div>
        <div class="field"><label>Motivo (opcional)</label><input type="text" id="blkReason" placeholder="Ej: almuerzo, mantenimiento…" /></div>
        <button class="btn btn-primary btn-block" id="blkSubmit">Bloquear</button>
      </div>
    </div>
  `);
  const close = ()=>{ state.showBlockModal = false; render(); };
  overlay.querySelector('.close-x').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  overlay.querySelector('#blkSubmit').onclick = async ()=>{
    const date = overlay.querySelector('#blkDate').value;
    const time = overlay.querySelector('#blkTime').value;
    const dur = parseInt(overlay.querySelector('#blkDur').value)||60;
    const reason = overlay.querySelector('#blkReason').value.trim();
    if(!date || !time){ showToast('Completa fecha y hora'); return; }
    await refreshBookings();
    const nStart = timeToMin(time), nEnd = nStart+dur;
    const conflict = getBookingsForDate(date).some(b=>{
      const bStart = timeToMin(b.time), bEnd = bStart+b.duration;
      return nStart < bEnd && nEnd > bStart;
    });
    if(conflict){ showToast('Ya hay algo agendado en ese horario'); return; }
    state.bookings.push({
      id: uid(), date, time, duration: dur, typeId: null,
      clientName: 'Bloqueado', clientContact: '', notes: reason,
      status: 'blocked', createdAt: Date.now()
    });
    await saveBookings();
    showToast('Horario bloqueado');
    close();
  };
  return overlay;
}

loadAll();
</script>
